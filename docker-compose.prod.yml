# Deploy with ./deploy.sh. TAG picks a commit's images (default: latest).
name: fliprag-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  caddy:
    image: ghcr.io/erik3010/fliprag-web:${TAG:-latest}
    build:
      context: .
      target: web
    restart: unless-stopped
    # Overridable for a local trial.
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env}
    volumes:
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - server
    logging: *logging

  server:
    image: ghcr.io/erik3010/fliprag-server:${TAG:-latest}
    build:
      context: .
      target: server
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_URL: postgres://fliprag:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/fliprag
      CHROMA_URL: http://chroma:8000
      PORT: '3000'
    depends_on:
      db:
        condition: service_healthy
      chroma:
        condition: service_started
    logging: *logging

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fliprag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: fliprag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fliprag -d fliprag']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  chroma:
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    volumes:
      - chromadata:/data
    logging: *logging

volumes:
  pgdata:
  chromadata:
  caddydata:
  caddyconfig:
