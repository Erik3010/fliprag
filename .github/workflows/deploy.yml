name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# One deploy at a time; a second push waits for the first instead of cancelling it.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          SKIP_SIMPLE_GIT_HOOKS: '1'
      # The apps typecheck against these packages' built output.
      - run: pnpm --filter @fliprag/schemas --filter @fliprag/db build
      - run: pnpm typecheck
      - run: pnpm lint

  images:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [server, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/erik3010/fliprag-${{ matrix.target }}:${{ github.sha }}
            ghcr.io/erik3010/fliprag-${{ matrix.target }}:latest
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on the VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          # The key may only run ci-deploy.sh on the server; this sends it the commit to deploy.
          ssh -i ~/.ssh/deploy_key "$TARGET" "$GITHUB_SHA"
